   "summary": "What this site is for, and what I plan to write about.",
   "body": "I\u2019m moving from AI and full-stack engineering into robotics. This notebook is where I\u2019ll publish what I find along the way: small experiments, notes on papers, and the things that didn\u2019t work.\n\n## What to expect\n\n- **ROS 2 experiments.** Nodes, launch files, and simulation setups, with the code that ran.\n- **Perception.** Computer vision carried over from my ML work, applied to robots.\n- **Reading notes.** Short summaries of papers and what I\u2019d try next.\n\nEach entry is dated and tagged, so you can follow one thread at a time.\n\n```bash\nros2 run demo_nodes_cpp talker\n```",

  {
   "id": "lidar-part-1",
   "title": "LIDAR, part 1: shooting light at things I can't see",
   "date": "2026-09-29",
   "tags": [
    "lidar",
    "perception",
    "ros2"
   ],
   "summary": "What confused me first about LIDAR, what the toy behind this page gets wrong, and the five projects I'm planning.",
   "body": "Click anywhere on the empty background of this page. Keep clicking.\n\nThere's a robot arm back there. You can't see it until you shoot light at it, and even then you only get dots: 2,400 per click, arranged in 16 horizontal lines, coloured by height. After a dozen clicks the dots start to look like a shoulder, an elbow, a gripper reaching for something on the floor.\n\nI built that toy before I understood much about how LIDAR works. This entry is me going back and trying to earn it.\n\n## Why LIDAR, coming from computer vision\n\nMost of my background is in ML, including computer vision. Cameras are great at *what*: colour, texture, labels. They're bad at *where*. A single image has no depth, so a network has to guess it from cues like shading and perspective, and guesses fail in exactly the situations a robot cares about: low light, glare, a white wall, something it has never seen.\n\nLIDAR flips that. It gives almost no semantics, just geometry, but the geometry is measured rather than inferred. That trade is what pulled me in.\n\n## The one equation\n\nFire a laser pulse, time how long the reflection takes to come back, and halve it:\n\n```text\ndistance = (speed of light \u00d7 round-trip time) / 2\n```\n\nThe halving is the part I kept forgetting, because the light has to go there *and* back. The numbers are what made it click for me:\n\n- One metre of distance is about 6.7 nanoseconds of round trip.\n- One centimetre is about 67 picoseconds.\n\nSo a sensor that measures to the centimetre is timing light to within tens of picoseconds, thousands of times a second. I still find that a little absurd.\n\n## Things that confused me (in the order they confused me)\n\n**2D vs 3D.** A 2D LIDAR spins a single beam in a flat plane and returns a ring of distances, which is what most indoor robots and robot vacuums use for mapping. A 3D LIDAR stacks several beams at different vertical angles. Each beam traces its own ring, which is why 3D scans look like contour lines on the ground. The toy on this page fakes 16 channels, borrowing the layout of the classic 16-beam spinning sensors.\n\n**Why far away things turn into a few sad dots.** The beams fan out, so the gap between rings grows with distance. A person at 5 m might be hit by several rings; at 50 m, maybe one or two. More range doesn't mean more detail.\n\n**Points aren't a picture.** A camera image is a tidy grid. A point cloud is an unordered bag of (x, y, z) and maybe intensity. You can't just run a normal CNN on it, which is why there's a whole family of point cloud networks (PointNet was the one everyone pointed me to first).\n\n**The sensor moves while it scans.** A spinning LIDAR takes around a tenth of a second per revolution. If the robot is driving, the start and end of the sweep are measured from different places, and straight walls come out bent. Undoing that (deskewing) needs odometry or an IMU. This one surprised me the most.\n\nDrag the speed up and watch the room smear. Then turn on the correction.\n\n```viz motion-distortion\n```\n\n**Multiple returns.** One pulse can bounce off a leaf, then a branch, then the ground, and some sensors report all of them. That's how aerial LIDAR sees the ground through a forest canopy.\n\n**Wavelength matters.** Many sensors use about 905 nm, others about 1550 nm. At 1550 nm the eye's lens and cornea absorb the light before it reaches the retina, so those sensors can run at higher power and reach further. Newer FMCW designs also measure velocity per point, using the Doppler shift.\n\n## What the toy behind this page gets wrong\n\nBeing honest about the fake:\n\n- Every ray hits perfectly. Real returns have noise, dropouts and range error.\n- There's no reflectivity. Black rubber, glass and mirrors are all hard for real sensors; here everything reflects.\n- The rays start at your eye, not at a sensor mounted somewhere in the scene.\n- Nothing moves, so there's no motion distortion to correct.\n\nEach of those is a thing I'd like to add, because breaking the toy on purpose is a good way to learn why the real pipeline exists.\n\n## The projects I'm planning\n\nI'm ordering these from cheapest and simplest to most involved. Nothing below has results yet. Those will get their own entries as I finish (or fail at) each one.\n\n| Project | Hardware | What it should teach me |\n|---|---|---|\n| Desk scanner | Single-point ToF sensor on a pan\u2013tilt servo mount, microcontroller | Time of flight, noise, building a cloud one point at a time |\n| Map my apartment | Cheap 2D spinning LIDAR, ROS 2, slam_toolbox | LaserScan messages, RViz2, SLAM, loop closure |\n| Find the part the arm is reaching for | Simulated 3D LIDAR in Gazebo, Open3D | Ground removal, clustering, handing a pose to a manipulator |\n| Real street data | KITTI dataset, Open3D, KISS-ICP | Registration, odometry, why deskewing matters |\n| Phone scan vs. LIDAR scan | A phone with a depth sensor | Dense short-range depth vs. sparse long-range points |\n\n### 1. Desk scanner\n\nThe dumbest possible version of a 3D scanner: one distance sensor that measures one point, swept left\u2013right and up\u2013down by two servos. Each (pan, tilt, distance) triple becomes one point. It'll be slow and noisy, and I think that's the point. I want to see the noise before a fancy sensor hides it from me.\n\n### 2. Map my apartment with a 2D LIDAR\n\nPlug a 2D LIDAR into ROS 2, watch the `LaserScan` messages in RViz2, then let slam_toolbox build an occupancy map while I carry it around. Converting a scan into points was the first bit of code that made the message format make sense to me:\n\n```python\nimport math\n\ndef scan_to_points(scan):\n    \"\"\"sensor_msgs/LaserScan -> list of (x, y) in the sensor frame.\"\"\"\n    points = []\n    for i, r in enumerate(scan.ranges):\n        if scan.range_min \u003c r \u003c scan.range_max:   # drop invalid and out-of-range readings\n            angle = scan.angle_min + i * scan.angle_increment\n            points.append((r * math.cos(angle), r * math.sin(angle)))\n    return points\n```\n\n### 3. Find the part the arm is reaching for\n\nThis one is the background of this page made real. Put a simulated 3D LIDAR next to a simulated arm in Gazebo, get a point cloud, then:\n\n1. Remove the floor with RANSAC plane fitting.\n2. Cluster what's left into objects.\n3. Pick the cluster that looks like the part, estimate where it is, and hand that pose to the arm.\n\nThe Open3D version of steps 1 and 2 is surprisingly short, which makes me suspicious I'm missing the hard part:\n\n```python\nimport numpy as np\nimport open3d as o3d\n\npcd = o3d.io.read_point_cloud(\"scan.pcd\").voxel_down_sample(voxel_size=0.01)\nplane, inliers = pcd.segment_plane(distance_threshold=0.02, ransac_n=3, num_iterations=1000)\nobjects = pcd.select_by_index(inliers, invert=True)          # everything that isn't floor\nlabels = np.array(objects.cluster_dbscan(eps=0.05, min_points=10))\nprint(f\"found {labels.max() + 1} clusters\")\n```\n\nHere's the same idea in 2D, slowed down so you can watch RANSAC guess, keep its best guess, peel the floor away and group what's left:\n\n```viz ransac\n```\n\n### 4. Real street data\n\nDownload a few sequences from KITTI, which was recorded with a 64-beam spinning LIDAR on a car. Do the same ground removal and clustering on real outdoor data, then try LIDAR odometry with KISS-ICP and see how far off it drifts. This is where the deskewing problem stops being theoretical.\n\n### 5. Phone scan vs. LIDAR scan\n\nScan the same object with a phone depth sensor and with whatever I've built by then, and compare them in CloudCompare. I expect the phone to win up close and lose badly past a few metres, but I'd rather measure it than assume it.\n\n## Questions I can't answer yet\n\n- How do people calibrate a LIDAR to a camera so the points and pixels line up?\n- When does ICP fail? I know it needs a decent starting guess; I don't yet have a feel for how decent.\n- How do real systems deal with rain, fog and dust?\n- What makes a point cloud network better than just projecting points into a depth image and using a normal CNN?\n\nIf you know, I'd genuinely like to hear it.\n\n## Resources I'm working through\n\n- The ROS 2 documentation for `sensor_msgs/LaserScan` and `PointCloud2`\n- Open3D's point cloud tutorials\n- slam_toolbox, for 2D mapping in ROS 2\n- The KITTI and nuScenes datasets\n- *LOAM: Lidar Odometry and Mapping in Real-time* (Zhang and Singh, 2014), which several people told me to read next\n",

   "id": "lidar-rover-in-life",
   "title": "LIDAR, part 1.5: a rover that dodges the Game of Life",
   "date": "2026-09-29",
   "tags": [
    "lidar",
    "planning",
    "game of life"
   ],
   "summary": "A single cell with a 72-beam 2D LIDAR tries to survive inside Conway's Game of Life.",
   "body": "The background of this page is a small experiment: what if a robot with a 2D LIDAR had to survive inside Conway's Game of Life?\n\nThe rover is a single cell. It isn't part of the Life rules, so it doesn't change the world, but it loses a point every time it ends a generation on a live cell. It never gets to look at the grid directly. All it knows is what its LIDAR sees.\n\nClick the background to throw an R-pentomino at it.\n\n```viz lidar-life\n```\n\n## What the rover does every generation\n\n1. **Scan.** It fires 72 beams in a circle. Each beam walks outward cell by cell and stops at the first live cell it meets. Cells a beam passed through are known to be empty; cells behind a hit are unknown.\n2. **Predict.** For each of its nine possible moves (the eight neighbours, or staying put), it works out the chance that the target cell will be alive in the next generation. Life's rule is local, so this only needs the target cell and its eight neighbours. Seen neighbours count as they are; unseen ones are assumed alive with a 25% prior, and the rover adds up the binomial odds of getting exactly the right number of neighbours for a birth or survival.\n3. **Score and move.** The collision chance dominates the score. Ties are broken by clearance (how close the nearest hit is in that direction) and open space (how far the beams reach in that direction), which is roughly the idea behind the vector field histogram method used on real robots.\n\nThe grey dot is a blind random walker living in the same world, as a baseline.\n\n## The math\n\n**The world.** $A_t(c)$ is 1 if cell c is alive at generation t. Every cell has eight neighbours \ud835\udca9(c), and Life's rule is one function of a cell's state a and its live-neighbour count n:\n\n```math\nL(a, n) = 1  if n = 3,  or if a = 1 and n = 2;   otherwise 0\nA_{t+1}(c) = L( A_t(c), N_t(c) ),    N_t(c) = \u03a3_{c\u2032 \u2208 \ud835\udca9(c)} A_t(c\u2032)\n```\n\nIn this version the rover is *not* a live cell. It sits at $x_t$ and never changes the world.\n\n**The scan.** Beam k of 72 points at angle $\u03b8_k$ and walks outward to a maximum range R. It reports the distance to the first live cell:\n\n```math\n\u03b8_k = 2\u03c0k / 72,    k = 0, 1, \u2026, 71\nr_k = min { d \u2264 R :  A_t( x_t + round(d \u00b7 (cos \u03b8_k, sin \u03b8_k)) ) = 1 }     (r_k = R if nothing is hit)\n```\n\nCells a beam passes through before $r_k$ are *seen empty*, the cell it stops on is *seen alive*, and every other cell within 3 of the rover is *unseen*.\n\n**Collision probability.** There are nine moves m \u2208 {\u22121, 0, 1}\u00b2, each targeting the cell c = $x_t$ + m. Let K be the number of c's neighbours seen alive, U the number unseen, and p = 0.25 the chance an unseen cell is alive. The neighbour count N is then K plus a binomial:\n\n```math\nP(N = j) = C(U, j \u2212 K) \u00b7 p^{j \u2212 K} \u00b7 (1 \u2212 p)^{U \u2212 j + K}\ns = 1 if c is seen alive,   0 if seen empty,   p if unseen\nP_{hit}(m) = s \u00b7 [ P(N = 2) + P(N = 3) ]  +  (1 \u2212 s) \u00b7 P(N = 3)\n```\n\nThat last line is just Life's rule in probability form: a live cell survives on 2 or 3 neighbours, a dead one is born on exactly 3.\n\n**Clearance.** For a move in direction $\u03c6_m$ = atan2($m_y$, $m_x$), the sector $S_m$ is every beam within 30\u00b0 of it (all 72 beams for staying still):\n\n```math\nd_{min}(m) = min_{k \u2208 S_m} r_k           r\u0304(m) = (1 / |S_m|) \u00b7 \u03a3_{k \u2208 S_m} r_k\n```\n\n**Risk, and the choice.** Each move gets a cost, and the rover takes the cheapest:\n\n```math\nJ(m) = 10 \u00b7 P_{hit}(m)  +  1.2 \u00b7 e^{\u2212d_{min}(m) / 4}  +  0.6 \u00b7 (1 \u2212 r\u0304(m) / R)\n            +  0.08 \u00b7 \ud835\udfd9[m = \u2212m_{prev} \u2260 0]  +  \u03b5\n\u03b5 ~ Uniform(0, 0.02)\nm\u22c6 = argmin_{m} J(m)\n```\n\n- **The 10 \u00b7 $P_{hit}$ term** dominates. A 10% chance of collision costs about as much as the clearance term ever can, so clearance and open space only decide between moves that are about equally safe.\n- **The $1.2 \u00b7 e^{\u2212d/4}$ term** pushes away from nearby hits. It's 1.2 at distance 0 and fades to about 0.1 by 10 cells.\n- **The $0.6 \u00b7 (1 \u2212 r\u0304/R)$ term** prefers directions where beams travel far, which is roughly the vector field histogram idea.\n- **0.08 for reversing** stops it dithering back and forth, and **\u03b5** breaks exact ties.\n\n**Scoring.** A collision is ending a generation on a live cell:\n\n```math\ncollisions per 1,000 generations = (1000 / T) \u00b7 \u03a3_{t=1}^{T} A_t(x_t)\n```\n\n## What I found\n\nIn test runs of 12,000 generations, the rover didn't collide once in either world. The blind walker hit something about 30 times per 1,000 generations in glider rain and about 55 per 1,000 in random soup.\n\nThat result is less impressive than it sounds. Life is deterministic and local, so a one-step prediction with a clear view of the neighbourhood is almost exact. The LIDAR rarely leaves a neighbour unseen at that range. The interesting part is where this breaks:\n\n- **Occlusion.** When a live cell sits right next to the rover, it hides the cells behind it, and the prior starts to matter.\n- **Boxed in.** If all nine moves are bad, the best it can do is pick the least bad one. One step of lookahead can walk it into a dead end.\n- **No memory.** It forgets everything between scans. It can't tell that a glider is heading its way; it only reacts once the glider is adjacent.\n\n## What I'd try next\n\n- Keep a short history of scans and estimate which hits are moving and where to, the same way real LIDAR tracking separates moving objects from static ones.\n- Look two or three generations ahead instead of one.\n- Add sensor noise (missed returns, false hits) and see how quickly the perfect record falls apart.\n",

   "id": "lidar-rover-hunts",
   "title": "LIDAR, part 1.6: the rover gets hungry",
   "date": "2026-09-29",
   "tags": [
    "lidar",
    "planning",
    "game of life"
   ],
   "summary": "The rover becomes an immortal live cell that hunts. Five strategies, direct vs indirect kills, and a twin world to keep score.",
   "body": "In [part 1.5](#/e/lidar-rover-in-life) the rover's only job was to stay out of the way. That turned out to be almost too easy. So I flipped its directive: now it hunts.\n\nThe rules changed in two ways:\n\n- **It's a live cell now.** When the Game of Life works out the next generation, the rover counts as a live neighbour, so it can cause births and deaths around it.\n- **It can't die.** Whatever the rules say, its own cell stays alive.\n\nIt still only knows what its 72-beam LIDAR sees.\n\n```viz rover-hunt\n```\n\n## Direct vs indirect kills\n\nI wanted to separate what the rover destroys itself from what it causes, so I had to pin down the words:\n\n- **Direct kill:** the rover steps onto a live cell. That cell is gone.\n- **Indirect kill:** a neighbour of the rover dies this generation, but would have lived if the rover weren't there. I check this by recounting each neighbour's neighbours with the rover's cell holding whatever was there before it arrived.\n- **Cell created:** the reverse. A neighbour is born or survives only because the rover added one to its neighbour count.\n- **The twin world:** a copy of the world with no rover in it, fed exactly the same gliders at the same times. The gap between the two populations is the long-run effect, including every cascade the rover set off.\n\nThe first three are immediate, one-generation effects. The twin is the only measure that captures the chain reactions.\n\n## Five strategies\n\n1. **One-step planner:** simulates the next generation for each of its nine moves using only what the LIDAR saw, and picks the move with the most direct plus indirect kills minus cells created.\n2. **Overcrowder:** never aims to step on anything. It positions itself where its presence as a neighbour kills the most cells.\n3. **Greedy eater:** steps onto any adjacent live cell it can see, otherwise heads for the nearest LIDAR hit.\n4. **Random walker:** ignores the LIDAR. A baseline.\n5. **Parked:** never moves. A control for what happens just from being a live cell in the way.\n\nWhen a strategy sees nothing worth doing, it heads toward the nearest thing its LIDAR hit, or wanders if nothing is in range.\n\n## The math\n\nI'm reusing L(a, n) and $A_t(c)$ from [part 1.5](#/e/lidar-rover-in-life). Two things change: the rover counts as a live cell, and it can't die.\n\n```math\nA_{t+1}(c) = L( A_t(c), N_t(c) )    for every c \u2260 x_{t+1}\nA_{t+1}(x_{t+1}) = 1\n```\n\nEach generation the rover picks a move m, steps to x\u2032 = $x_t$ + m, and then Life runs with the rover counted in its neighbours' totals.\n\n**Direct kill.** Did it step onto a live cell?\n\n```math\nD_t = A_t(x\u2032)      (1 if the rover moved onto a live cell, which is removed)\n```\n\n**Indirect kills and created cells.** For each neighbour c of the rover's new cell, N(c) is its live-neighbour count *with* the rover. The counterfactual N\u2032(c) swaps the rover back out for whatever was in that cell before it arrived:\n\n```math\nN\u2032(c) = N(c) \u2212 1 + D_t\nI_t = \u03a3_{c \u2208 \ud835\udca9(x\u2032)} \ud835\udfd9[ L(A(c), N\u2032(c)) = 1  and  L(A(c), N(c)) = 0 ]      would have lived, dies\nC_t = \u03a3_{c \u2208 \ud835\udca9(x\u2032)} \ud835\udfd9[ L(A(c), N\u2032(c)) = 0  and  L(A(c), N(c)) = 1 ]      would have been dead, lives\n```\n\nIf the rover ate a cell, N\u2032 = N, so eating on its own never counts as an indirect effect.\n\n**The twin world.** $B_t$ evolves from the same start with the same glider schedule, but no rover. The gap is how many fewer cells the rover's world has, and I report its average:\n\n```math\nG_t = |B_t| \u2212 ( |A_t| \u2212 1 )\n\u1e20 = (1 / T) \u00b7 \u03a3_{t=1}^{T} G_t\n```\n\nThe table's per-100 rates are 100/T \u00b7 \u03a3 $D_t$, 100/T \u00b7 \u03a3 $I_t$ and 100/T \u00b7 \u03a3 $C_t$, and net indirect is 100/T \u00b7 \u03a3 ($I_t$ \u2212 $C_t$).\n\n**The strategies.** D\u0302(m), \u00ce(m) and \u0108(m) are the same three quantities, predicted before moving from the LIDAR belief, with unseen cells treated as empty. \u03b5 ~ Uniform(0, 0.01) breaks ties.\n\n```math\nPlanner:        score(m) = D\u0302(m) + \u00ce(m) \u2212 \u0108(m) + \u03b5\nOvercrowder:    score(m) = \u00ce(m) \u2212 0.5 \u00b7 D\u0302(m) + \u03b5\n```\n\nBoth take the highest-scoring move, but only if its score is above 0.02. Otherwise they fall back to heading for the nearest thing the LIDAR hit, or wandering if nothing is in range:\n\n```math\nm_{toward} = ( sign \u0394x, sign \u0394y )      toward the nearest LIDAR hit\nm_{wander} = current heading,  replaced by a random one with probability 0.03 each generation\n```\n\nThe other three don't score anything:\n\n```math\nGreedy eater:   m\u22c6 = a seen-alive neighbour if there is one,  else m_{toward}\nRandom walker:  m\u22c6 ~ Uniform{ \u22121, 0, 1 }\u00b2\nParked:         m\u22c6 = (0, 0)\n```\n\n- **The planner's objective is myopic.** It maximises one-generation damage, which is why it can't see that eating a whole still life beats making a neighbour die of overcrowding for one generation.\n- **The overcrowder's \u22120.5 \u00b7 D\u0302** is the only thing stopping it from eating. That's deliberate: it isolates the indirect effect.\n\n## Results\n\nEvery strategy ran on the same four seeded worlds for 1,000 generations on a 120 \u00d7 80 wrap-around grid, so the comparison is paired: same starting cells, same glider schedule. Numbers are per 100 generations; net indirect is indirect kills minus cells created. The benchmark button on the figure above reruns exactly this (it takes about a minute).\n\n**Random soup** (20% of cells alive at the start, no new gliders):\n\n| Strategy | Direct kills | Indirect kills | Cells created | Net indirect | Fewer cells than twin (avg) |\n|---|---|---|---|---|---|\n| One-step planner | 27.9 | 69.2 | 13.1 | 56.0 | 53.5 |\n| Overcrowder | 7.4 | 225.1 | 146.4 | 78.7 | \u22126.4 |\n| Greedy eater | 90.2 | 3.0 | 8.0 | \u22125.0 | 106.3 |\n| Random walker | 10.9 | 32.0 | 52.8 | \u221220.8 | 28.4 |\n| Parked | 0.0 | 132.2 | 97.5 | 34.7 | 12.4 |\n\n**Glider rain** (a new glider every 12 generations):\n\n| Strategy | Direct kills | Indirect kills | Cells created | Net indirect | Fewer cells than twin (avg) |\n|---|---|---|---|---|---|\n| One-step planner | 30.6 | 66.5 | 16.7 | 49.8 | 33.6 |\n| Overcrowder | 8.6 | 195.9 | 153.6 | 42.3 | 35.0 |\n| Greedy eater | 89.0 | 2.6 | 5.9 | \u22123.3 | \u221230.0 |\n| Random walker | 7.6 | 23.0 | 38.4 | \u221215.4 | \u22120.4 |\n| Parked | 0.0 | 114.1 | 97.8 | 16.2 | \u221244.5 |\n\n## What I think it means\n\n**Eating works.** The greedy eater makes almost one direct kill every generation, and in random soup it leaves the world about 106 cells emptier than its twin on average, twice as much as anything else. Soup settles into still lifes and blinkers, and a rover that just walks from one to the next and chews through them is hard to beat.\n\n**Immediate indirect kills are a misleading number.** The overcrowder and the parked rover rack up huge indirect counts, but they create nearly as many cells as they kill. Sitting next to a blinker or a still life, the rover kills a cell, it comes back, it kills it again. Most of that \"killing\" is churn. Net indirect (kills minus cells created) is the fairer number, and the twin gap is fairer still: in soup the overcrowder actually leaves slightly *more* cells than a world without it.\n\n**The planner is the only one that is decent at both.** It gets about a third of the greedy eater's direct kills, and because it counts the cells it would create, its net indirect score is strong: the best in glider rain, and second in soup behind the overcrowder, whose score there doesn't survive the twin comparison. It has the second-best twin gap in soup.\n\n**Glider rain is too chaotic for four seeds.** The twin gaps swing from +35 to \u221245, and negative numbers mean the rover's world ended up with more cells than the twin. Hitting a glider can start a reaction that grows into a much bigger mess than the glider itself. I don't trust any ranking in that table except the direct kills. It needs many more runs.\n\n## What I'd try next\n\n- Run glider rain with 50+ seeds and put confidence intervals on the twin gap.\n- Give the planner a two- or three-generation horizon, and score it on the twin gap directly instead of immediate kills.\n- Let the planner learn which still lifes collapse completely when eaten, and which ones it should eat in a particular order.\n- Put two rovers in the same world with different strategies.\n",

    "effect": "rover",
    "variant": "hunt-planner"
   },

   "id": "lidar-rover-farms",
   "title": "LIDAR, part 1.7: the rover learns to farm",
   "date": "2026-09-29",
   "tags": [
    "lidar",
    "planning",
    "game of life"
   ],
   "summary": "Rovers stop being live cells, so the farmer has to find structures that feed it. A five-generation planner, a LIDAR that sees more when fed, and why seeing less helps.",
   "body": "*Revised 30 September 2026.* In the first version of this entry, rovers were live cells. A parked rover counted as a neighbour, made cells grow next to it, and ate them, so most of what a \"farmer\" ate was food its own body had grown. That isn't the farming I was after. Now Life can't see rovers at all. A rover has to find structures that grow food on their own, and put itself where the food will turn up.\n\nIn [part 1.6](#/e/lidar-rover-hunts), the parked rover kept \"killing\" the same cells over and over, because its presence as a neighbour made them grow back. That gave me the idea of farming. This entry asks the question properly: without the rover's help, what in Life keeps producing food, and can a rover with nothing but a LIDAR find it?\n\n## The rules\n\n- **Rovers aren't live cells.** Life never counts a rover as a neighbour. Each generation a rover moves one square or stays, then eats the cell it's standing on if that cell is alive.\n- **Moving costs energy:** 1 per step by default. Staying still is free.\n- **Eating earns energy:** 10 per cell by default.\n- **At 100 energy, a rover splits.** A child appears in a free neighbouring square with 20 energy, enough to walk off and look for its own food, and the parent drops to 0.\n- **A well-fed rover sees more.** The LIDAR is a cone pointing the way the rover last moved. At 0 energy it's 90\u00b0 wide, and it widens with energy to the full 360\u00b0 at 100. Every rover also feels its eight neighbours, and a rover with nothing to do turns 45\u00b0 each generation to look around.\n- **Harvesting rovers broadcast a beacon.** Farmers within 6 squares hear it (it's radio, not LIDAR, so it works behind their backs) and keep off the eight squares around it.\n\nA rover with no energy can't wander, but it can still step onto a live cell next to it, because the meal pays for the step. Rovers can't share a square, and each one only knows what its own LIDAR sees. Colonies are capped at 40 rovers to keep the page fast; the rays, the yellow hits and the purple planned path belong to the first rover.\n\nA meal is **harvested** if the rover didn't move to get it: it stayed put and a cell was born in its square, delivered by the structures around it. A meal it stepped onto is **grazed**.\n\n```viz rover-farm\n```\n\n## A block is a farm\n\nThe best farm I've found is the most boring object in Life. A block is four cells in a 2 \u00d7 2 square, and it never changes. Eat one corner, and the other three cells still have two neighbours each, so they survive. The empty corner has exactly three, so it's born again next generation:\n\n```text\nblock      eat a corner      next generation\n # #           . #                # #\n # #           # #                # #\n```\n\nA rover sitting on that corner eats one cell every generation, forever, without moving. In my first test, a single block in an otherwise empty world fed a farmer for 600 generations and grew a colony of 40 rovers: the colony ate 597 cells, and 596 of them were harvested from that one block.\n\nSoup and glider collisions leave blocks lying around everywhere, along with other still lifes and oscillators. Not all of them survive a bite. A blinker, for example, dies if you eat the cell it's about to grow. The farmer's job is to tell the difference from what it can see.\n\nI keep a running catalogue on the [spotted farms page](farms.html): which common structures survive being eaten, and which ones the farmers actually use. A logging tool runs this simulation offline, and the page updates itself whenever it spots a new farm.\n\n## Four strategies\n\n1. **Farmer:** runs Life five generations ahead on what its LIDAR saw, and plans the path that eats the most. It favours squares where cells keep being born, and only goes exploring when nothing in reach is worth anything and it can afford to.\n2. **Ambusher:** never pays to move. It eats whatever is born under it, or steps onto a live cell next to it.\n3. **Greedy eater:** eats anything under or next to it, otherwise pays to chase the nearest LIDAR hit.\n4. **Random walker:** moves at random whenever it can afford to. A baseline.\n\n## The math\n\n**Field of view.** With energy E, split threshold \u03b8 = 100, and the narrowest and widest views $\u03c6_{min}$ = 90\u00b0 and $\u03c6_{max}$ = 360\u00b0:\n\n```math\n\u03c6(E) = \u03c6_{min} + (\u03c6_{max} \u2212 \u03c6_{min}) \u00b7 min( E / \u03b8, 1 )\n```\n\nA beam fires if its direction is within \u03c6 / 2 of the rover's heading. Beams are 5\u00b0 apart, so a starving rover fires about 19 of its 72.\n\n**The energy budget.** Each rover has an energy counter E. With meal reward R, move cost $c_m$ and idle cost $c_i$:\n\n```math\nE_{t+1} = max( 0,  E_t + R \u00b7 \ud835\udfd9[ate]  \u2212  c_m \u00b7 \ud835\udfd9[moved]  \u2212  c_i )\nR = 10,   c_m = 1,   c_i = 0,   E = 50 for the first rover\n```\n\nA rover can never go into debt, so some moves aren't allowed:\n\n```math\nonto a live cell:      allowed if  E_t \u2212 c_m + R \u2265 0      (the meal pays for the step)\nonto an empty cell:    allowed if  E_t \u2265 c_m\nonto another rover:    never\n```\n\n**Splitting.** With a cap of 40 rovers:\n\n```math\nif E \u2265 \u03b8,  n \u003c 40  and a neighbouring square is free:    child there with E = 20,  parent E \u2190 0\nif n = 40:    E \u2190 min(E, \u03b8)\n```\n\n**The farmer's forecast.** The farmer copies what its LIDAR saw within 6 squares into a small grid $G_0$, counting unseen cells as empty, and runs Life on it for H = 5 generations. Every rover's square is emptied each generation, its own included, because a rover eats whatever is born under it:\n\n```math\nG_{t+1}(c) = L( G_t(c), N_t(c) )    for every cell c,    then    G_{t+1}(r) = 0    for every rover square r\n```\n\n**The plan.** A rover standing on q after generation t can move to any free neighbour q\u2032 or stay. Arriving eats whatever the forecast says is there. Staying only eats if a new cell is born, because the rover already ate the last one, and that needs exactly three live neighbours:\n\n```math\nreward(q \u2192 q\u2032, t+1) = R \u00b7 G_{t+1}(q\u2032) \u2212 c_m      if q\u2032 \u2260 q\nreward(q \u2192 q,  t+1) = R \u00b7 \ud835\udfd9[ N_t(q) = 3 ]        if it stays\n```\n\nIt works backwards from the horizon (backward induction, a small dynamic program), with discount \u03b3 = 0.9. At the horizon, a square where cells were born in each of the last two generations counts as a farm site, worth two more meals:\n\n```math\nV_H(q) = 2R \u00b7 \ud835\udfd9[ N_{H\u22121}(q) = 3  and  N_{H\u22122}(q) = 3 ]\nV_t(q) = max_{q\u2032 \u2208 {q} \u222a \ud835\udca9(q), q\u2032 free}   reward(q \u2192 q\u2032, t+1)  +  \u03b3 \u00b7 V_{t+1}(q\u2032)\n```\n\nThe first move is scored on what the LIDAR sees now, and only affordable moves count. Eating a cell changes the structure it belongs to, so every first move onto food gets its own forecast with that cell removed. That's how the farmer tells a block (eat a corner and it grows back) from a blinker (eat a cell and it dies):\n\n```math\nm\u22c6 = argmax_{affordable m}   R \u00b7 \ud835\udfd9[food at x + m]  \u2212  c_m \u00b7 \ud835\udfd9[m \u2260 0]  +  \u03b3 \u00b7 V_1(x + m)  +  \u03b5\n```\n\nIf the best plan is worth less than 0.5 and it has energy to spare, it explores: toward the nearest food it can see, or straight ahead if that's fenced off:\n\n```math\nif  V(m\u22c6) \u003c 0.5  and  E > 3 \u00b7 c_m + 5:     m\u22c6 = m_{toward}  or  m_{ahead}\n```\n\n**Fences.** A rover that harvested this generation broadcasts a beacon. To a farmer that hears it, the beacon's square and its eight neighbours are off limits. I added this after watching children eat the block that fed their parent: the two block cells nearest the child hid the other two from its LIDAR, so it had no way to tell the cell was part of a farm.\n\n**The other strategies** use the same energy rules and the same LIDAR, and stay put when a move isn't affordable:\n\n```math\nAmbusher:       m\u22c6 = (0, 0) if food is under it,  else a random neighbouring live cell,  else (0, 0)\nGreedy eater:   m\u22c6 = (0, 0) if food is under it,  else a random neighbouring live cell,  else m_{toward}\nRandom walker:  m\u22c6 ~ Uniform{ \u22121, 0, 1 }\u00b2\n```\n\n**The scores in the table:**\n\n```math\ncells eaten per 100 generations = (100 / T) \u00b7 \u03a3_t meals_t\nharvested share = ( meals eaten without moving ) / ( all meals )\nmeals per move = \u03a3_t meals_t / \u03a3_t moves_t\ncolony full = first t with n_t = 40\n```\n\n## Results\n\nSame setup as before: four seeded worlds per strategy, 1,000 generations each, on a 120 \u00d7 80 wrap-around grid, move cost 1, meal reward 10, field of view 90\u00b0 to 360\u00b0. \"Colony full\" is the average generation the colony reached 40 rovers. The benchmark button on the figure reruns exactly this, and the sliders let you change the costs and the narrowest view first.\n\n**Random soup:**\n\n| Strategy | Cells eaten per 100 gens | Harvested share | Meals per move | Rovers at gen 1,000 | Colony full |\n|---|---|---|---|---|---|\n| Farmer | 1,195 | 95% | 4.88 | 40 | gen 138 |\n| Ambusher | 13 | 24% | 1.31 | 10.3 | never |\n| Greedy eater | 98 | 41% | 0.25 | 40 | gen 119 |\n| Random walker | 3 | 8% | 0.07 | 1.5 | never |\n\n**Glider rain:**\n\n| Strategy | Cells eaten per 100 gens | Harvested share | Meals per move | Rovers at gen 1,000 | Colony full |\n|---|---|---|---|---|---|\n| Farmer | 564 | 93% | 2.47 | 40 | gen 362 |\n| Ambusher | 4 | 21% | 1.42 | 4.0 | never |\n| Greedy eater | 45 | 29% | 0.18 | 27.3 | gen 681 (1 of 4 runs) |\n| Random walker | 2 | 12% | 0.09 | 1.0 | never |\n\n**How wide should the view be?** Farmer only, changing the narrowest view (the view at 0 energy). At 360\u00b0 the view never changes:\n\n| Narrowest view | Soup: cells eaten per 100 gens | Glider rain: cells eaten per 100 gens |\n|---|---|---|\n| 30\u00b0 | 1,443 | 454 |\n| 90\u00b0 | 1,195 | 564 |\n| 180\u00b0 | 1,247 | 565 |\n| 360\u00b0 | 769 | 260 |\n\n## What I think it means\n\n**Farming is now almost all the farmer does.** 95% of its meals in soup were harvested: it sat still and food was born into its square. Its meals per move are above 1 because most meals don't need a move at all. It eats about 12 times as much as the greedy eater, in both worlds.\n\n**Without their own bodies to farm with, the other strategies collapse.** In the first version, every strategy ended up farming by accident, because dozens of live rovers packed together made food grow around them. Now nobody gets that for free. The greedy eater still fills the colony in soup, but it eats whatever it finds, structures included, and then there's little left. The ambusher and the random walker barely grow at all.\n\n**Seeing less helps.** This was the surprise. A farmer that always sees 360\u00b0 eats about a third less in soup (769 against 1,195) and less than half as much in glider rain. It isn't that full-view farmers find fewer farms: children found one about as often either way (65% against 69% in soup). It's how long they stay. With a 90\u00b0 minimum, a harvesting streak lasted 89 generations on average; with 360\u00b0, 47. A farmer that sees everything keeps spotting a better meal nearby, walks over and grazes it, and a five-generation plan can't see that the farm it left would have fed it for hundreds more. A narrow view after each split works like patience. Tying vision to energy was meant as a reward for eating well; it turns out to be a good rule for other reasons too. It has limits, though: at 30\u00b0 the farmer does even better in soup but worse in glider rain, where food arrives from every direction.\n\n**Move cost matters less now.** Tripling the move cost to 3 cut the farmer to 891 cells per 100 generations and slowed the colony down (full at about gen 183 instead of 138). Most of its food doesn't need a move, so it rarely pays.\n\n## Caveats\n\n- The 40-rover cap shapes everything after the colony fills. These numbers compare harvesting rates at the cap more than growth.\n- The forecast is exact only for a rover that stays put. When the farmer plans a path, it models how its first meal changes the structures around it, but not the meals after that.\n- The fence is a rule I added after watching children wreck their parents' farms, not something the rovers learned.\n- Most children still get stuck. Once they've spent their 20 energy without finding a farm, they can't afford to move, and they wait for food to come to them.\n- Four seeds is still few, especially for glider rain.\n\n## What I'd try next\n\n- Let a child inherit its parent's LIDAR scan, so it knows where the farms are instead of walking around half blind.\n- Charge a small upkeep for staying still, to see whether farms are still worth it.\n",

          '<p>' + (world === 'soup' ? 'Random soup' : 'Glider rain') + ', 120 × 80 torus, 4 seeds × 1,000 generations. The last column compares population with an identical world that never had a rover in it.</p>';
        var names = HUNT_STRATEGIES.map(function (st) { return st.name; }), avg = function (k) { return HUNT_STRATEGIES.map(function (st) { return res[st.id][k] / res[st.id].n; }); };
        var lines = function (key) { return HUNT_STRATEGIES.map(function (st) { var ag = aggregate(res[st.id].traces, key); return { name: st.name, color: STRAT_COLORS[st.id], mean: ag.mean, lo: ag.lo, hi: ag.hi }; }); };
        table.insertAdjacentHTML('beforeend', '<p class="chart-legend">' + HUNT_STRATEGIES.map(function (st) { return '<span><i style="background:' + STRAT_COLORS[st.id] + '"></i>' + esc(st.name) + '</span>'; }).join('') + '</p>');
        var grid = chartGrid(table);
        charts = [
          barChart(grid, 'What each strategy does per 100 generations', 'Direct kills, indirect kills, and cells its presence created.', names,
            [{ name: 'Direct kills', color: '#e0685f', values: avg('direct') }, { name: 'Indirect kills', color: '#e6b85c', values: avg('indirect') }, { name: 'Cells created', color: '#74a3e3', values: avg('created') }]),
          lineChart(grid, 'Direct kills so far', 'Cumulative cells the rover stepped on.', lines('direct'), 10),
          lineChart(grid, 'Net indirect kills so far', 'Cumulative indirect kills minus cells created. Flat means churn: killing cells that grow back.', lines('net'), 10),
          lineChart(grid, 'Population gap vs the twin world', 'Above zero: fewer live cells than an identical world with no rover.', lines('gap'), 10)
        ]; });
  };
  var stop = loop(visible, function (dt, t) {
    if (!REDUCED) { acc += dt * 12; var n = Math.min(3, Math.floor(acc)); acc -= n; for (var i = 0; i < n; i++) sim.step(); }
    drawRover(sim, ctx, buf.off, buf.offCtx, s, buf.o);
    if (t - capT > 500) { capT = t; var p = sim.per100();
      cap.innerHTML = 'Generation ' + sim.gen.toLocaleString() + '. Per 100 generations: <strong>' + p.direct.toFixed(1) + '</strong> direct kills (red), <strong>' + p.indirect.toFixed(1) + '</strong> indirect kills (gold), <strong>' + p.created.toFixed(1) + '</strong> cells created (blue). ' + (sim.twinPop != null ? 'Population ' + sim.pop + ' vs ' + sim.twinPop + ' in the twin world with no rover.' : ''); }
  });
  return function () { stop(); ro.disconnect(); if (cancelBench) cancelBench(); };
} };

/* 5. Farming: energy economy, reproduction, and a benchmark */
VIZ['rover-farm'] = { mount: function (fig, visible) {
  var wrap = document.createElement('div'); wrap.className = 'viz-stage'; var c = document.createElement('canvas'); wrap.appendChild(c); fig.appendChild(wrap);
  var ctrl = vizControls(fig);
  ctrl.innerHTML = '<label>Strategy <select data-s>' + FARM_STRATEGIES.map(function (s) { return '<option value="' + s.id + '">' + esc(s.name) + '</option>'; }).join('') + '</select></label>' +
    '<label>World <select data-w><option value="soup">Random soup</option><option value="glider-rain">Glider rain</option></select></label>' +
    '<label>Move cost <input type="range" min="0" max="5" step="0.5" value="1" data-c> <output data-co>1</output></label>' +
    '<label>Meal reward <input type="range" min="1" max="20" step="1" value="10" data-f> <output data-fo>10</output></label>' +
    '<label>Narrowest view <input type="range" min="30" max="360" step="30" value="90" data-v> <output data-vo>90°</output></label>' +
    '<button type="button" class="btn" data-r>Reset</button><button type="button" class="btn" data-b>Run benchmark</button>';
  var cap = vizCaption(fig, ''), table = document.createElement('div'); table.className = 'viz-table'; fig.appendChild(table);
  var q = function (sel) { return ctrl.querySelector(sel); }, sim, s, B, ctx = c.getContext('2d'), acc = 0, capT = 0, cancelBench = null, charts = [];
  var ro = new ResizeObserver(function () { charts.forEach(function (d) { d(); }); }); ro.observe(table);
  function params() { return { moveCost: parseFloat(q('[data-c]').value), foodReward: parseFloat(q('[data-f]').value), fovMin: parseFloat(q('[data-v]').value) }; }
  function setup() { var w = wrap.clientWidth || 600; s = Math.max(4, Math.floor(w / 120)); var cols = Math.floor(w / s), rows = Math.round(cols * 0.55);
    c.width = cols * s; c.height = rows * s; c.style.width = cols * s + 'px'; c.style.height = rows * s + 'px';
    var o = { world: q('[data-w]').value, strategy: q('[data-s]').value }, p = params(); for (var k in p) o[k] = p[k];
    sim = new FarmSim(cols, rows, o); B = farmBuffers(sim); }
  setup();
  q('[data-s]').onchange = setup; q('[data-w]').onchange = setup; q('[data-r]').onclick = setup;
  q('[data-c]').oninput = function () { q('[data-co]').textContent = this.value; setup(); };
  q('[data-f]').oninput = function () { q('[data-fo]').textContent = this.value; setup(); };
  q('[data-v]').oninput = function () { q('[data-vo]').textContent = this.value + '°'; setup(); };
  c.addEventListener('pointerdown', function (ev) { var r = c.getBoundingClientRect(); sim.drop(Math.floor((ev.clientX - r.left) / s), Math.floor((ev.clientY - r.top) / s)); });
  q('[data-b]').onclick = function () {
    if (cancelBench) return; var btn = q('[data-b]'); btn.disabled = true; var world = q('[data-w]').value, p = params();
    table.innerHTML = '<p>Running every strategy on the same 4 seeded ' + (world === 'soup' ? 'soup' : 'glider rain') + ' worlds for 1,000 generations each: <span data-p>0%</span></p>';
    cancelBench = farmBenchmark(world, p, { trials: 4, gens: 1000 }, function (f) { var el = table.querySelector('[data-p]'); if (el) el.textContent = Math.round(f * 100) + '%'; },
      function (res) { cancelBench = null; btn.disabled = false;
        var rows = FARM_STRATEGIES.map(function (st) { var r = res[st.id], filled = r.full.filter(function (x) { return x != null; });
          var avg = filled.length ? Math.round(filled.reduce(function (x, y) { return x + y; }, 0) / filled.length) : null;
          return '<tr><th scope="row">' + esc(st.name) + '</th><td>' + (r.eaten / r.n).toFixed(0) + '</td><td>' + Math.round(100 * r.harvestShare / r.n) + '%</td><td>' + (r.perMove / r.n).toFixed(2) + '</td><td>' + (r.rovers / r.n).toFixed(1) + '</td><td>' + (avg == null ? 'never' : 'gen ' + avg + (filled.length < r.n ? ' (' + filled.length + ' of ' + r.n + ' runs)' : '')) + '</td></tr>'; }).join('');
        table.innerHTML = '<table><thead><tr><th></th><th>Cells eaten per 100 gens</th><th>Harvested share</th><th>Meals per move</th><th>Rovers at gen 1,000</th><th>Colony full (40)</th></tr></thead><tbody>' + rows + '</tbody></table>' +
          '<p>' + (world === 'soup' ? 'Random soup' : 'Glider rain') + ', move cost ' + p.moveCost + ', meal reward ' + p.foodReward + ', field of view ' + p.fovMin + '° to 360°, split at 100 energy, 120 × 80 torus, 4 seeds × 1,000 generations.</p>';
        var names = FARM_STRATEGIES.map(function (st) { return st.name; }), avg = function (k) { return FARM_STRATEGIES.map(function (st) { return res[st.id][k] / res[st.id].n; }); };
        var lines = function (key) { return FARM_STRATEGIES.map(function (st) { var ag = aggregate(res[st.id].traces, key); return { name: st.name, color: STRAT_COLORS[st.id], mean: ag.mean, lo: ag.lo, hi: ag.hi }; }); };
        table.insertAdjacentHTML('beforeend', '<p class="chart-legend">' + FARM_STRATEGIES.map(function (st) { return '<span><i style="background:' + STRAT_COLORS[st.id] + '"></i>' + esc(st.name) + '</span>'; }).join('') + '</p>');
        var grid = chartGrid(table);
        charts = [
          lineChart(grid, 'Colony size', 'Rovers alive. The colony is capped at 40.', lines('rovers'), 10),
          lineChart(grid, 'Cells eaten so far', 'Cumulative meals across the whole colony.', lines('eaten'), 10),
          lineChart(grid, 'Harvested share of meals', 'Share of all meals so far that were born under a rover that stayed put.', lines('harvest'), 10, '%'),
          barChart(grid, 'Meals per move', 'Meals divided by paid moves. Harvesting needs no move, so a rover that farms scores above 1.', names, [{ name: 'Meals per move', color: '#e6b85c', values: avg('perMove') }])
        ]; });
  };
  var stop = loop(visible, function (dt, t) {
    if (!REDUCED) { acc += dt * 12; var n = Math.min(3, Math.floor(acc)); acc -= n; for (var i = 0; i < n; i++) sim.step(); }
    drawFarm(sim, ctx, B, s);
    if (t - capT > 500) { capT = t; cap.textContent = farmStatsText(sim); }
  });
  return function () { stop(); ro.disconnect(); if (cancelBench) cancelBench(); };
} };

window.addEventListener('hashchange', route);
route();
})();
